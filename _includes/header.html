<header>
  <div class="header-left">
    <a href="javascript:void(0)" class="back-button" onclick="history.back()" aria-label="Voltar" title="Voltar">{% include svg/nav-arrow-left.svg %}</a>
    <div>
      <a class="site-title" href="{{ site.url }}">{{ site.title }}</a>
      <small>
        {% if site.tagshort %}
        {{ site.tagshort }}
        {% else %}
        {{ site.taglong }}
        {% endif %}
      </small>
    </div>
  </div>
  <a id="theme-toggle" class="toggle-icon" onclick="modeSwitcher()"></a>
</header>
